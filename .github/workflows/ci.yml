name: CI

# Every push to any branch builds. Pull requests build only when they come from a fork:
# a same-repository PR is already built by its branch's push. `pull_request` (never
# `pull_request_target`) runs fork code with a read-only token and no secrets.
on:
    push:
    pull_request:
    workflow_dispatch:

# The workflow only reads the repository.
permissions:
    contents: read

# One run per branch or PR at a time. A newer push to a PR cancels its older run; runs on
# branches finish, so every pushed commit gets a result.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    BUN_VERSION: 1.4.4
    # Node runs every test again (`bun run test:node`), and starts the agent.
    NODE_VERSION: 26

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment), so a
# moved or compromised tag can't change what runs here.
#
# No dependency cache, deliberately. Every build runs the repository's own code (install
# scripts, tests, Stryker), and Bun reuses cached packages without re-checking them against
# the lockfile, so a cache shared between builds could carry tampered packages from one
# build into the next. A fresh install takes seconds.
jobs:
    check:
        name: Check and test
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  package-manager-cache: false
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run spellcheck
            - run: bun run typecheck
            # Vitest annotates failures in the PR on its own when GITHUB_ACTIONS is set.
            - run: bun run test
            # The agent runs on Node as well as Bun, so the whole suite runs on Node too.
            - run: bun run test:node
            # The tests load the code through Vite's transform, so this is the one check that
            # Node's own type stripping loads the agent. Nothing listens on port 9, so the agent
            # has to exit with 1, saying it can't reach LM Studio. Actions runs the script with
            # `bash -e`, so the exit code is caught rather than ending the step.
            - name: Start the agent on Node
              env:
                  MODEL_PROVIDER: lmstudio
                  MODEL_BASE_URL: http://127.0.0.1:9/v1
                  MODEL_API_KEY: ci-local-key
                  MODEL: ci-model
                  MODEL_REASONING_EFFORT: none
                  MAX_STEPS: '1'
                  FILE_TOOLS: write-edit
                  LOG_FORMAT: json
                  WORK_DIR: .
                  DATA_DIR: ${{ runner.temp }}
              run: |
                  status=0
                  output=$(bun run agent:node -p 'Check startup' 2>&1) || status=$?
                  echo "$output"

                  if [[ $status -ne 1 || $output != *"Can't reach LM Studio"* ]]; then
                      echo "::error::Expected the agent to exit with 1, saying it can't reach LM Studio; it exited with $status"
                      exit 1
                  fi
            # Report only: the advisories are mostly in transitive dev tooling, and a hard gate
            # would block every build on a third party's release schedule. The step shows as
            # failed when there are advisories, but the job passes. Upgrade by hand and review
            # the lockfile diff; `bun audit fix` is not wired in.
            - name: Audit dependencies (report only)
              run: bun audit
              continue-on-error: true

    # The scheduler runs on Mac hosts first and in Linux containers later, so its checks run on
    # both. rustup on the runner installs the toolchain that rust-toolchain.toml pins, at the first
    # cargo command.
    scheduler:
        name: Scheduler
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        strategy:
            # Each system's result stands on its own.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        defaults:
            run:
                working-directory: packages/scheduler
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: cargo fmt --check
            - run: cargo clippy --all-targets --locked -- -D warnings
            - run: cargo test --locked
            # The memory guard is a TypeScript file that Bun runs.
            - if: matrix.os == 'ubuntu-latest'
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            # Prebuilt binaries, so neither tool compiles here; cargo-mutants ships them for x86_64
            # Linux, which ubuntu-latest is.
            - if: matrix.os == 'ubuntu-latest'
              uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
              with:
                  tool: cargo-mutants,cargo-deny
            # Under the memory guard, as Stryker runs. cargo-mutants exits non-zero when a mutant
            # survives or times out, which fails the job. Two jobs halve the time on the runner's
            # 4 vCPUs; its book advises starting there, since cargo already builds and tests in
            # parallel.
            - name: Mutation testing
              if: matrix.os == 'ubuntu-latest'
              run: bun run mutation -j 2
            # Report only, as `bun audit` is: the step shows as failed when a dependency has an
            # advisory, but the job passes.
            - name: Audit dependencies (report only)
              if: matrix.os == 'ubuntu-latest'
              run: cargo deny check advisories
              continue-on-error: true

    mutation:
        name: Mutation testing
        needs: check
        runs-on: ubuntu-latest
        # A full run of 7414 mutants took 4h33m on 2026-11-07, and GitHub-hosted runners allow at
        # most 360 minutes, all of which the job gets.
        timeout-minutes: 360
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run mutation
            - name: Upload the mutation report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: mutation-report
                  path: reports/mutation/
                  if-no-files-found: ignore
                  retention-days: 14
