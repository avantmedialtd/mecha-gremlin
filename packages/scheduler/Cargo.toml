[package]
name = "gremlin-scheduler"
version = "0.0.0"
edition = "2024"
description = "Starts each job's command at its cron schedule's fires, and keeps their logs"
license = "MIT"
publish = false

[dependencies]
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
jiff = { version = "0.2.42", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
] }
mutants = "0.0.4"
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
toml = "1.2.1"

[lints.clippy]
# The counterpart of the repository's rule against index files: a module is `x.rs`, never
# `x/mod.rs`.
mod_module_files = "deny"
